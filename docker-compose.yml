services:
  app:
    build: .
    # ports の左辺を 127.0.0.1 に固定しているため、このホスト以外からは到達できない。
    # 公開範囲を決めているのはこの 1 行であって、アプリのバインド先ではない（ADR-0006 改訂）。
    # ここを "3000:3000" に変えると同一ネットワーク上の他の端末から認証なしで閲覧可能になる。
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # コンテナ内でループバックにバインドすると、ホストからポート公開しても到達できない。
      # 露出範囲は上の ports が抑えているため、ここでは明示的にオプトインする。
      HOST: "0.0.0.0"
      ALLOW_NON_LOOPBACK_BIND: "1"
    env_file:
      - .env
    volumes:
      # コンテナを作り直しても SQLite ファイルが残るようにする。
      - four-keys-data:/data
    restart: "no"

volumes:
  four-keys-data:
